name: Test voix IA
on: workflow_dispatch
jobs:
  convert:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Installer
        run: |
          (sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1 && pip install "numpy<2" soundfile && pip install torch==2.4.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu) 2>&1 | tee 1install.log
      - name: Preparer les audios
        run: |
          (ls; mkdir -p work
          i=0
          for f in ref*; do i=$((i+1)); ffmpeg -y -loglevel error -i "$f" -ar 16000 -ac 1 work/ref$i.wav; done
          f=$(ls me.* | head -1)
          ffmpeg -y -loglevel error -i "$f" -ar 16000 -ac 1 work/me.wav) 2>&1 | tee 2prep.log
      - name: Convertir
        run: |
          python - <<'EOF' 2>&1 | tee 3conv.log
          import torch, torchaudio, glob, soundfile as sf
          knn = torch.hub.load('bshall/knn-vc', 'knn_vc', prematched=True, trust_repo=True, pretrained=True, device='cpu')
          ms = knn.get_matching_set(sorted(glob.glob('work/ref*.wav')))
          q = knn.get_features('work/me.wav')
          for k in (4, 8):
              out = knn.match(q, ms, topk=k)
              sf.write('out_k%d.wav' % k, out.numpy(), 16000)
          EOF
      - name: Afficher l erreur
        if: failure()
        run: |
          f=$(ls -t *.log | head -1)
          echo "::error title=$f::$(tail -n 12 $f | tr '\n' ' ' | cut -c1-900)"
      - uses: actions/upload-artifact@v4
        with:
          name: voix-convertie
          path: out_k*.wav
